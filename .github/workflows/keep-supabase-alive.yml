name: keep-supabase-alive (twice daily)

on:
  schedule:
    - cron: "0 6 * * *"    # 06:00 UTC
    - cron: "0 18 * * *"   # 18:00 UTC
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL_PROJECT_A }}
      SUPABASE_ANON: ${{ secrets.SUPABASE_ANON_PROJECT_A }}
    steps:
      - name: Ping Supabase auth health
        run: |
          set -e
          curl --fail-with-body -sS "$SUPABASE_URL/auth/v1/health" \
            -H "apikey: $SUPABASE_ANON" \
            -H "Authorization: Bearer $SUPABASE_ANON" | jq .
